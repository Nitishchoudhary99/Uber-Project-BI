name: PocketHost Android

on:
  push:
    paths: ["pockethost/**", ".github/workflows/pockethost-android.yml"]
  pull_request:
    paths: ["pockethost/**", ".github/workflows/pockethost-android.yml"]
  workflow_dispatch:
    inputs:
      ollama_version:
        description: "Ollama tag (empty = latest release)"
        required: false
      cloudflared_version:
        description: "cloudflared tag (empty = latest release)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve engine versions
        run: |
          latest() { curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name; }
          echo "OLLAMA_VERSION=${{ inputs.ollama_version || '' }}" >> "$GITHUB_ENV"
          echo "CLOUDFLARED_VERSION=${{ inputs.cloudflared_version || '' }}" >> "$GITHUB_ENV"
          [ -n "${{ inputs.ollama_version }}" ] || echo "OLLAMA_VERSION=$(latest ollama/ollama)" >> "$GITHUB_ENV"
          [ -n "${{ inputs.cloudflared_version }}" ] || echo "CLOUDFLARED_VERSION=$(latest cloudflare/cloudflared)" >> "$GITHUB_ENV"

      - name: Cache engines
        id: engines
        uses: actions/cache@v4
        with:
          path: pockethost/native/out
          key: engines-${{ env.OLLAMA_VERSION }}-${{ env.CLOUDFLARED_VERSION }}-${{ hashFiles('pockethost/native/build.sh') }}

      - uses: actions/setup-go@v5
        if: steps.engines.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false

      - name: Build engines (Ollama + cloudflared for Android arm64)
        if: steps.engines.outputs.cache-hit != 'true'
        run: bash pockethost/native/build.sh

      - name: Bundle engines into the app
        run: |
          mkdir -p pockethost/android/app/src/main/jniLibs/arm64-v8a
          cp pockethost/native/out/arm64-v8a/*.so pockethost/android/app/src/main/jniLibs/arm64-v8a/
          ls -lh pockethost/android/app/src/main/jniLibs/arm64-v8a/
          cat pockethost/native/out/versions.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        working-directory: pockethost/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease \
            -PollamaVersion="${OLLAMA_VERSION#v}" -PcloudflaredVersion="$CLOUDFLARED_VERSION"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp pockethost/android/app/build/outputs/apk/debug/app-debug.apk out/PocketHost-debug.apk
          cp pockethost/android/app/build/outputs/apk/release/app-release.apk out/PocketHost.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: PocketHost-apk
          path: out/*.apk
