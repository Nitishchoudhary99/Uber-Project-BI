<!doctype html><meta charset="utf-8"><title>Sample apply form</title>
<form onsubmit="window.__submitted=true;return false">
<label for="a">Full Name *</label><input id="a" required>
<label>Email Address <input type="email" name="em"></label>
<input name="mobile_number" placeholder="Mobile number">
<input id="fn" autocomplete="given-name" placeholder="x">
<label for="co">Current Company</label><input id="co">
<label for="yoe">Total experience (years)</label><input id="yoe">
<label for="np">Notice period</label><input id="np">
<label for="ex">Expected CTC (LPA)</label><input id="ex" required>
<label for="g">Gender</label><select id="g"><option>Male</option><option>Female</option></select>
<label for="loc">Current location</label><input id="loc" value="Mumbai">
<label for="li">LinkedIn profile URL</label><input id="li">
<label for="wa">Are you authorised to work in India?</label><select id="wa"><option>Select</option><option>Indian citizen</option><option>Need sponsorship</option></select>
<label for="why">Why do you want this job?</label><textarea id="why"></textarea>
<label for="cv">Resume</label><input type="file" id="cv">
<label for="x">Favourite colour</label><input id="x">
<button type="submit" id="submit">Submit application</button></form>
